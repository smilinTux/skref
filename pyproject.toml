[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skref"
version = "0.1.0"
description = "Sovereign encrypted reference vaults — FUSE mount, GPG-at-rest, any backend"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "smilinTux", email = "admin@smilintux.org"},
]
keywords = [
    "encryption", "fuse", "gpg", "vault", "sovereign",
    "storage", "cloud", "reference", "gtd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
fuse = ["pyfuse3>=3.3"]
nextcloud = ["webdavfs>=0.4", "requests>=2.28"]
s3 = ["boto3>=1.28"]
all = [
    "pyfuse3>=3.3",
    "webdavfs>=0.4",
    "requests>=2.28",
    "boto3>=1.28",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.3",
]

[project.scripts]
skref = "skref.cli:main"

[project.urls]
Homepage = "https://smilintux.org"
Repository = "https://github.com/smilinTux/smilintux-org"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
